<!doctype html>
<html lang="zh-Hant">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phaser Run and Gun Prototype</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
