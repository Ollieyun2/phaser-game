<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phaser Run and Gun Prototype</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      overflow: hidden;
      font-family: monospace;
    }

    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #runtime-error {
      display: none;
      position: fixed;
      inset: 16px;
      z-index: 9999;
      padding: 14px;
      background: rgba(80, 0, 0, 0.94);
      color: #fff;
      white-space: pre-wrap;
      overflow: auto;
      border: 2px solid #ff6b6b;
      font-size: 13px;
    }

    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="runtime-error"></div>

  <script>
    function showRuntimeError(message) {
      const box = document.getElementById('runtime-error');
      box.style.display = 'block';
      box.textContent = 'Prototype runtime error:\n\n' + message;
    }

    window.addEventListener('error', event => {
      showRuntimeError(event.message + '\n' + (event.filename || '') + ':' + (event.lineno || ''));
    });

    window.addEventListener('unhandledrejection', event => {
      showRuntimeError(String(event.reason));
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
  <script src="./src/game.js"></script>
</body>
</html>
